name: Sign and attach theme

on:
  release:
    types: [published]

permissions:
  contents: write  # needed to upload a release asset

jobs:
  build:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build and sign package
        env:
          JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: make package

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} build/package.xpi

  update-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build manifest
        run: |
          mkdir -p _site
          VERSION=${{ github.event.release.tag_name }}
          XPI_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/package.xpi"
          curl -sf "https://dark-theme.dgaylo.com/updates.json" \
            -o _site/updates.json || echo '{"addons":{"dark-theme@dgaylo.com":{"updates":[]}}}' > _site/updates.json
          jq --arg v "${VERSION#v}" --arg url "$XPI_URL" \
             '.addons["dark-theme@dgaylo.com"].updates += [{"version": $v, "update_link": $url}]' \
             _site/updates.json > _site/updates.json.tmp
          mv _site/updates.json.tmp _site/updates.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
